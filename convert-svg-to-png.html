<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to PNG Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #0077b5;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #005885;
        }
        #preview {
            margin: 20px 0;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>SVG to PNG Converter</h1>
    <p>Цей інструмент конвертує SVG зображення в PNG для використання в og:image.</p>
    
    <button onclick="convertToPNG()">Конвертувати SVG в PNG</button>
    
    <div id="preview"></div>
    
    <script>
        async function convertToPNG() {
            // Завантажуємо SVG файл
            const response = await fetch('linkedin-share-image.svg');
            const svgText = await response.text();
            
            // Створюємо canvas
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 630;
            const ctx = canvas.getContext('2d');
            
            // Створюємо зображення з SVG
            const img = new Image();
            const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                
                // Конвертуємо в PNG
                canvas.toBlob(function(blob) {
                    const link = document.createElement('a');
                    link.download = 'linkedin-share-image.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    
                    // Показуємо preview
                    const preview = document.getElementById('preview');
                    preview.innerHTML = '<h3>Preview:</h3><img src="' + link.href + '" style="max-width: 100%; border: 1px solid #ddd;">';
                }, 'image/png');
                
                URL.revokeObjectURL(url);
            };
            
            img.src = url;
        }
    </script>
</body>
</html>
