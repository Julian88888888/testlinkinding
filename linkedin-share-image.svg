<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005885;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- LinkedIn icon background circle -->
  <circle cx="600" cy="200" r="80" fill="white" opacity="0.2"/>
  <circle cx="600" cy="200" r="60" fill="white" opacity="0.3"/>
  
  <!-- LinkedIn "in" text (simplified) -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">in</text>
  
  <!-- Name and Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle">Julian Ushanskiu</text>
  
  <!-- Position -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.95">Web UI Developer</text>
  
  <!-- Location -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.9">🇺🇦 Ukraine</text>
  
  <!-- Description -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.85">I am Yulian</text>
  
  <!-- Coins Score -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">🪙 Coins Score: 1000</text>
  
  <!-- Bottom decoration -->
  <line x1="200" y1="560" x2="1000" y2="560" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>

