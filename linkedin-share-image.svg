<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005885;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- LinkedIn icon background circle -->
  <circle cx="600" cy="200" r="80" fill="white" opacity="0.2"/>
  <circle cx="600" cy="200" r="60" fill="white" opacity="0.3"/>
  
  <!-- LinkedIn "in" text (simplified) -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">in</text>
  
  <!-- Main title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">LinkedIn Share Test</text>
  
  <!-- Subtitle -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">Open Graph Meta Tags Testing</text>
  
  <!-- Email info -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.8">Email: test@example.com</text>
  
  <!-- Bottom decoration -->
  <line x1="200" y1="550" x2="1000" y2="550" stroke="white" stroke-width="3" opacity="0.3"/>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">1200 × 630 pixels</text>
</svg>

