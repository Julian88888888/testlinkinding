<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Share Link Example</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="My Share Link Title" />
  <meta property="og:description" content="This is an example of link preview with avatar image." />
  <meta property="og:url" content="https://example.com/" />
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/13494508?v=4" />
  <meta property="og:image:width" content="460" />
  <meta property="og:image:height" content="460" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="My Share Link Title" />
  <meta name="twitter:description" content="This is an example of link preview with avatar image." />
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/13494508?v=4" />
</head>
<body>
  <h1>Share Link Preview Test</h1>
  <p>Share this page in Telegram, Facebook, Slack, or Twitter to see the preview.</p>
</body>
</html>
