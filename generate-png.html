<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PNG from SVG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #0077b5;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px 0;
        }
        button:hover {
            background: #005885;
        }
        #preview {
            margin: 20px 0;
            border: 2px dashed #0077b5;
            padding: 20px;
            border-radius: 8px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <h1>🖼️ Конвертація SVG в PNG</h1>
    <p>Натисніть кнопку для генерації PNG зображення з SVG</p>
    
    <button onclick="convertToPNG()">Генерувати PNG</button>
    
    <div id="preview"></div>
    
    <canvas id="canvas" width="1200" height="630"></canvas>
    
    <script>
        async function convertToPNG() {
            try {
                // Завантажуємо SVG файл
                const response = await fetch('linkedin-share-image.svg');
                const svgText = await response.text();
                
                // Створюємо canvas
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                
                // Створюємо зображення з SVG
                const img = new Image();
                const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                img.onload = function() {
                    // Малюємо SVG на canvas
                    ctx.drawImage(img, 0, 0);
                    
                    // Конвертуємо в PNG
                    canvas.toBlob(function(blob) {
                        const link = document.createElement('a');
                        link.download = 'linkedin-share-image.png';
                        link.href = URL.createObjectURL(blob);
                        link.click();
                        
                        // Показуємо preview
                        const preview = document.getElementById('preview');
                        const imgPreview = document.createElement('img');
                        imgPreview.src = link.href;
                        imgPreview.style.maxWidth = '100%';
                        imgPreview.style.border = '1px solid #ddd';
                        imgPreview.style.borderRadius = '4px';
                        preview.innerHTML = '<h3>✅ PNG згенеровано!</h3>';
                        preview.appendChild(imgPreview);
                        preview.innerHTML += '<p style="margin-top: 10px;"><strong>Файл завантажено автоматично.</strong><br>Тепер завантажте його в репозиторій як linkedin-share-image.png</p>';
                    }, 'image/png');
                    
                    URL.revokeObjectURL(url);
                };
                
                img.onerror = function() {
                    alert('Помилка завантаження SVG. Переконайтеся, що файл linkedin-share-image.svg існує.');
                };
                
                img.src = url;
            } catch (error) {
                console.error('Помилка:', error);
                alert('Помилка конвертації: ' + error.message);
            }
        }
    </script>
</body>
</html>
